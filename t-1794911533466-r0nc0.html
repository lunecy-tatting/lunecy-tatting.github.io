var HASP=false;
var SES=['ALL'];
var CUR={s:0,ty:-1,sort:'new',view:0};
var TYPES=[];var PCUR=null;
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function seOk(p){return CUR.s===0||(SES[CUR.s]==='NONE'?!p.se:p.se===SES[CUR.s]);}
function cmp(a,b){if(CUR.sort==='pr')return (parseFloat(b.pr)||0)-(parseFloat(a.pr)||0);return (b.ts||0)-(a.ts||0);}
function metaOf(p){var a=[p.ty,p.sz?'尺寸 '+p.sz:''];if(p.pr)a.push('¥'+p.pr);if(p.hr)a.push('工时 '+p.hr+'h');return a.filter(Boolean).join(' · ');}
function cardHtml(p){var i=P.indexOf(p);
  var nc=p.im.length>1?'<span class="bdg l">'+p.im.length+'配色</span>':'';
  var sb=p.se?'<span class="bdg r">'+(SS[p.se]||'')+' '+esc(p.se)+'</span>':'';
  var img=p.im.length?'<img loading="lazy" src="'+p.im[0].u+'">':'<div class="ph">图片待补</div>';
  return '<div class="pd"><div class="pimg" onclick="pdpShow('+i+')">'+img+nc+sb+'</div><div class="pnm">'+esc(p.n)+'</div><div class="pmt">'+esc(metaOf(p))+'</div></div>';}
function sortArr(a){return a.slice().sort(cmp);}
function renderAll(){var a=sortArr(P.filter(seOk));document.getElementById('gAll').innerHTML=a.map(cardHtml).join('');document.getElementById('nAll').style.display=a.length?'none':'';}
function buildSide(){var m={};P.filter(seOk).forEach(function(p){m[p.ty]=(m[p.ty]||0)+1;});TYPES=Object.keys(m).sort(function(a,b){return a.localeCompare(b,'zh');});
  if(CUR.ty<0||CUR.ty>=TYPES.length)CUR.ty=TYPES.length?0:-1;
  var h='';TYPES.forEach(function(t,i){h+='<div class="sti'+(i===CUR.ty?' on':'')+'" onclick="setTy('+i+')">'+esc(t)+'<br><span class="sc">'+m[t]+' 款</span></div>';});
