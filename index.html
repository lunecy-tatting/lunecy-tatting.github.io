<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🌙 梭编产品册</title><style>body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#faf6f0;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#6b5d4f}.ld{text-align:center}.ld .e{font-size:44px}.ld .t{margin-top:10px;font-size:14px;letter-spacing:2px}</style></head><body><div class="ld"><div class="e">🌙</div><div class="t">产品册加载中…</div></div>
<script>var VKEY="cat_v",HKEY="cat_h";
function put(h){document.open();document.write(h);document.close();}
function bust(u){return u+"?t="+Date.now();}
function start(){
  var cv=null,ch=null;try{cv=localStorage.getItem(VKEY);ch=localStorage.getItem(HKEY);}catch(e){}
  fetch(bust("ver.json")).then(function(r){return r.json();}).then(function(v){
    var ver=String((v&&v.v)||"");
    if(ver&&ch&&ver===cv){put(ch);return;}
    return fetch(bust("catalog.html")).then(function(r){return r.text();}).then(function(h){
      try{localStorage.setItem(HKEY,h);localStorage.setItem(VKEY,ver);}catch(e){}
      put(h);
    });
  }).catch(function(){
    if(ch){put(ch);return;}
    var t=document.querySelector(".t");if(t)t.textContent="加载失败，请检查网络后重试";
  });
}
start();</script></body></html>
