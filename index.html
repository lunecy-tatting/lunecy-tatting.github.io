function buildSide(){var m={};P.filter(seOk).forEach(function(p){m[p.ty]=(m[p.ty]||0)+1;});TYPES=Object.keys(m).sort(function(a,b){return a.localeCompare(b,'zh');});
  if(CUR.ty<0||CUR.ty>=TYPES.length)CUR.ty=TYPES.length?0:-1;
  var h='';TYPES.forEach(function(t,i){h+='<div class="sti'+(i===CUR.ty?' on':'')+'" onclick="setTy('+i+')">'+esc(t)+'<br><span class="sc">'+m[t]+' 款</span></div>';});
  document.getElementById('side').innerHTML=h||'<div class="sti">无</div>';}
function renderCat(){buildSide();var a=CUR.ty<0?[]:sortArr(P.filter(function(p){return seOk(p)&&p.ty===TYPES[CUR.ty];}));document.getElementById('gCat').innerHTML=a.map(cardHtml).join('');document.getElementById('nCat').style.display=a.length?'none':'';}
function showView(v){CUR.view=v;document.getElementById('vAll').style.display=v?'none':'';document.getElementById('vCat').style.display=v?'':'none';document.getElementById('tabAll').className='tab'+(v?'':' on');document.getElementById('tabCat').className='tab'+(v?' on':'');if(v)renderCat();}
function setS(i,el){CUR.s=i;renderAll();if(CUR.view)renderCat();var cs=document.querySelectorAll('#fse .echip');for(var k=0;k<cs.length;k++)cs[k].className='echip';el.className='echip on';}
function setTy(i){CUR.ty=i;renderCat();}
function paintSort(){var h='<span class="'+(CUR.sort==='new'?'on':'')+'" onclick="setSort(0)">上新</span>';if(HASP)h+='<span class="'+(CUR.sort==='pr'?'on':'')+'" onclick="setSort(1)">价格</span>';document.getElementById('sortbar').innerHTML=h;}
function setSort(m2){CUR.sort=m2?'pr':'new';renderAll();if(CUR.view)renderCat();paintSort();}
function pdpShow(i){PCUR=P[i];if(!PCUR)return;var h='';if(PCUR.im.length)h+='<img class="big" id="pdpimg" src="'+PCUR.im[0].u+'" onclick="lbP()">';
  if(PCUR.im.length>1){h+='<div class="chs">';PCUR.im.forEach(function(m,j){h+='<span class="echip'+(j?'':' on')+'" onclick="setImg('+j+',this)">'+esc(m.c)+'</span>';});h+='</div>';}
  h+='<div class="pnm" style="font-size:17px">'+esc(PCUR.n)+'</div><div class="pmt" style="font-size:13px">'+esc(metaOf(PCUR))+'</div><div class="x" onclick="pdpClose()">收 起</div>';
  document.getElementById('sheet').innerHTML=h;document.getElementById('pdp').style.display='flex';}
function setImg(j,el){if(!PCUR)return;var im=document.getElementById('pdpimg');if(im)im.src=PCUR.im[j].u;var cs=el.parentElement.querySelectorAll('.echip');for(var k=0;k<cs.length;k++)cs[k].className='echip';el.className='echip on';}
function pdpClose(){document.getElementById('pdp').style.display='none';}
function lbP(){var im=document.getElementById('pdpimg');document.getElementById('lbimg').src=im?im.src:'';document.getElementById('lb').style.display='flex';}
function lbClose(){document.getElementById('lb').style.display='none';}
function initFbar(){var ses=[];P.forEach(function(p){if(p.se&&ses.indexOf(p.se)<0)ses.push(p.se);});var order=['春','夏','春夏','秋','冬','秋冬','全季'];ses.sort(function(a,b){return order.indexOf(a)-order.indexOf(b);});
  var h='<span class="echip on" onclick="setS(0,this)">全部季节</span>';
  ses.forEach(function(s){SES.push(s);h+='<span class="echip" onclick="setS('+(SES.length-1)+',this)">'+(SS[s]||'')+' '+esc(s)+'</span>';});
  if(P.some(function(p){return !p.se;})){SES.push('NONE');h+='<span class="echip" onclick="setS('+(SES.length-1)+',this)">未标</span>';}
  document.getElementById('fse').innerHTML=h;}
paintSort();initFbar();renderAll();
document.getElementById('pdp').addEventListener('click',function(e){if(e.target===this)pdpClose();});</script></body></html>
